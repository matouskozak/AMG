[project]
name = "amg"
version = "0.1.0"
description = "Adversarial Malware Generator (AMG)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "gym>=0.26.2",
    "lief>=0.17.1",
    "lightgbm>=4.6.0",
    "pefile>=2024.8.26",
    "ray[tune]>=2.53.0",
    "scikit-learn>=1.7.2",
    "torch>=2.9.1",
]

[project.optional-dependencies]
test = [
    "pytest>=7.0.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
norecursedirs = ["gym_malware"]
