[project]
name = "amg"
version = "0.1.0"
description = "Adversarial Malware Generator (AMG)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "gym==0.23.1",
    "lief==0.12.2",
    "lightgbm>=4.6.0",
    "numpy<2",
    "pefile>=2024.8.26",
    "pydantic<2",
    "ray[rllib,tune]==2.0.1",
    "scikit-learn==1.1.3",
    "setuptools>=80.9.0",
    "signify==0.7.1",
    "tensorflow==2.10.0",
    "torch>=2.9.1",
]

[project.optional-dependencies]
test = [
    "pytest>=7.0.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
norecursedirs = ["gym_malware"]
